name: Build clashv (ipk & apk)

# 用法：
#   1. 本地一键发版：./scripts/release.sh（或 make release）——自动升版本号+提交+打 tag+推送，
#      推送 tag 触发本构建（也可以自己改 openwrt/Makefile 的 PKG_VERSION 后手动推 v* tag）
#   2. Actions 页面手动 Run workflow 随时触发
# 产物：Actions Artifacts + GitHub Release（tag = v<openwrt/Makefile 里的 PKG_VERSION>）
#
# 平台说明：一次编译产出 8 个包（ipk/apk 各 8 个）——
#   luci-app-clashv         通用版（内置 7 种架构 Go 二进制，装哪个设备都行，
#                           安装后由 /usr/bin/clashv 启动器按 DISTRIB_ARCH 自动
#                           选择，postinst 删除其余架构节省空间）
#   luci-app-clashv-<arch>  架构精简版 ×7（只内置对应架构二进制，包体约为通用版 1/7）
# 8 包互相 CONFLICTS，同一设备只能装一个；mihomo 内核由插件在界面上按架构一键下载。
#
# 缓存说明：OpenWrt SDK（含编译状态，kmod 重打包等大头）缓存在默认分支 master 名下，
# 由每周调度 / master 手动触发时保存；tag 发版运行从 master 读取（GitHub 缓存按分支
# 隔离，tag 运行保存的缓存别人读不到，所以 tag 运行不保存，避免白传几个 GB）。
# tag 运行的缓存读取量不计入 10GB 配额，保存才计入。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    # 每周一跑一次：① 保活 master 名下的 SDK 缓存（GitHub 缓存 7 天无人使用自动清理），
    # ② 跟进上游 snapshot SDK 文件名变化自动重建缓存。公开仓库不计费。
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Read PKG_VERSION
        id: v
        run: |
          version=$(grep 'PKG_VERSION:=' ./openwrt/Makefile | awk -F '=' '{print $2}')
          if [ -z "$version" ]; then
            echo "::error::无法从 openwrt/Makefile 读取 PKG_VERSION"
            exit 1
          fi
          # tag 触发时校验 tag 与版本号一致，防止忘了升版本就打 tag（手动触发无 tag，跳过）
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 openwrt/Makefile 的 PKG_VERSION=${version} 不一致，请提交版本号改动后用 release.sh 重新发版"
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

  Compile:
    runs-on: ubuntu-latest
    needs: Version
    strategy:
      fail-fast: false
      matrix:
        target:
          # ipk：22.03 SDK（opkg 系统 22.03/23.05 全部可用）
          - name: ipk
          # apk：25.12 稳定版 SDK（apk 系统 = 25.12+/snapshot；24.10 仍是 opkg）。
          # 两个目标都从 Docker Hub 官方 openwrt/sdk 正式版镜像直提 SDK
          #（快、tag 冻结不漂移），拉取失败自动回落 openwrt.org tarball 直下
          - name: apk
    steps:
      - uses: actions/checkout@v5

      # node 24：vite 构建用（Node 20 已于 2026-04 EOL）；action 本身的运行时
      # 也自 v5 起切到 node24，消除「Node.js 20 is deprecated」警告
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Dependencies
        run: |
          # curl/git/tar/zstd/rsync/python3/build-essential 在 runner 镜像里已预装，
          # 只装镜像缺的 python 包（也省掉 apt-get update 的十来秒）
          sudo apt-get -y install python3-pyelftools python3-setuptools

      # 解析 SDK 压缩包文件名作缓存 key（snapshot SDK 文件名随上游更新变化，自动失效）
      - name: Resolve SDK Name
        id: sdkname
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: sdkname
        run: echo "name=$(./scripts/ci-build.sh | grep -v '^==>' | head -n 1)" >> "$GITHUB_OUTPUT"

      # SDK 目录含解压后的完整构建状态：命中后跳过 Docker 镜像拉取 + 数百个预置
      # kmod 的重新打包（该步骤占包编译阶段 8 成以上耗时），只剩插件本体 ~25s
      - name: Restore OpenWrt SDK Cache
        id: sdkcache
        uses: actions/cache/restore@v5
        with:
          path: tmp/${{ matrix.target.name == 'ipk' && 'SDK' || 'SNAPSDK' }}
          key: openwrt-sdk-${{ matrix.target.name }}-${{ steps.sdkname.outputs.name }}

      # 构建流程抽在 scripts/ci-build.sh，与本地 scripts/build-local-docker.sh 共用同一条
      # 流水线，按阶段拆步保证日志可读、耗时可查
      - name: Build Frontend (Vite)
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: frontend
        run: ./scripts/ci-build.sh

      - name: Build Go Binaries (7 linux + 2 darwin)
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: go
        run: ./scripts/ci-build.sh

      - name: Download OpenWrt SDK
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: sdk
        run: ./scripts/ci-build.sh

      - name: Compile Package
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: package
        run: ./scripts/ci-build.sh

      # 只在默认分支保存：tag 运行保存的缓存按分支隔离，其他运行读不到，
      # 白白上传几个 GB。缓存完整命中时 key 不可覆盖，跳过保存。
      - name: Save OpenWrt SDK Cache
        if: github.ref == 'refs/heads/master' && steps.sdkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: tmp/${{ matrix.target.name == 'ipk' && 'SDK' || 'SNAPSDK' }}
          key: openwrt-sdk-${{ matrix.target.name }}-${{ steps.sdkname.outputs.name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: luci-app-clashv-${{ matrix.target.name }}
          path: tmp/out/*
          # artifact 只是本次 run 内传给 Release job 的中转，持久拷贝在 Release
          # 资产上；默认保留 90 天会把账号级制品存储配额（Free 500MB，所有私有
          # 仓库共享）吃满，导致后续 run 上传被拒（v0.1.9 踩过）
          retention-days: 1

  Release:
    runs-on: ubuntu-latest
    needs: [Version, Compile]
    # 只在 tag 发版时创建 Release：每周调度/master 手动预热也会跑 Compile，不能发版
    if: ${{ always() && contains(needs.Compile.result, 'success') && github.ref_type == 'tag' }}
    steps:
      # gh release create 需要从 git remote 推断仓库，必须先 checkout；
      # fetch-depth: 0 拉全量历史与 tag，才能生成上一个 tag 以来的提交列表
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: ./release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.Version.outputs.version }}
        run: |
          ls -lh ./release
          # 「更新内容」= 上一个 tag（不含）到本 tag 的提交，剔除版本号提交本身；
          # 手动触发时可能还没有任何 tag/提交区间，留空兜底。
          # 提交说明习惯用「；」分句，按它拆成子列表逐条换行，避免渲染成一整坨
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          CHANGES=$(git log $RANGE --format='%h %s' --no-decorate 2>/dev/null \
            | grep -v 'chore: 版本号升至' \
            | awk '{
                hash = $1; sub(/^[^ ]+ +/, ""); msg = $0
                n = split(msg, part, /；/)
                printf "- **%s** %s\n", hash, part[1]
                for (i = 2; i <= n; i++) {
                  gsub(/^ +| +$/, "", part[i])
                  if (part[i] != "") printf "  - %s\n", part[i]
                }
              }')
          {
            echo "## 📝 更新内容"
            echo
            if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "- 本次发版无功能提交"; fi
          } > notes.md
          gh release create "$TAG" --title "clashv v${{ needs.Version.outputs.version }}" \
            --notes-file notes.md --latest || true
          gh release upload "$TAG" ./release/* --clobber
