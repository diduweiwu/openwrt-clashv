name: Build clashv (ipk & apk)

# 用法：
#   1. 本地一键发版：./scripts/release.sh（或 make release）——自动升版本号+提交+打 tag+推送，
#      推送 tag 触发本构建（也可以自己改 openwrt/Makefile 的 PKG_VERSION 后手动推 v* tag）
#   2. Actions 页面手动 Run workflow 随时触发
# 产物：Actions Artifacts + GitHub Release（tag = v<openwrt/Makefile 里的 PKG_VERSION>）
#
# 平台说明：一次编译产出 8 个包（ipk/apk 各 8 个）——
#   luci-app-clashv         通用版（内置 7 种架构 Go 二进制，装哪个设备都行，
#                           安装后由 /usr/bin/clashv 启动器按 DISTRIB_ARCH 自动
#                           选择，postinst 删除其余架构节省空间）
#   luci-app-clashv-<arch>  架构精简版 ×7（只内置对应架构二进制，包体约为通用版 1/7）
# 8 包互相 CONFLICTS，同一设备只能装一个；mihomo 内核由插件在界面上按架构一键下载。

on:
  # push trigger disabled during identity rewrite (restored at master tip)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read PKG_VERSION
        id: v
        run: |
          version=$(grep 'PKG_VERSION:=' ./openwrt/Makefile | awk -F '=' '{print $2}')
          if [ -z "$version" ]; then
            echo "::error::无法从 openwrt/Makefile 读取 PKG_VERSION"
            exit 1
          fi
          # tag 触发时校验 tag 与版本号一致，防止忘了升版本就打 tag（手动触发无 tag，跳过）
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 openwrt/Makefile 的 PKG_VERSION=${version} 不一致，请提交版本号改动后用 release.sh 重新发版"
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

  Compile:
    runs-on: ubuntu-latest
    needs: Version
    strategy:
      fail-fast: false
      matrix:
        target:
          # ipk：22.03 SDK（opkg 系统 22.03/23.05 全部可用）
          - name: ipk
          # apk：snapshot SDK（apk 系统即 OpenWrt 24.10+/snapshot）
          - name: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install curl git tar zstd rsync python3 python3-pyelftools python3-setuptools build-essential

      # 构建流程抽在 scripts/ci-build.sh，与本地 scripts/build-local-docker.sh 共用同一条
      # 流水线，按阶段拆步保证日志可读、耗时可查
      - name: Build Frontend (Vite)
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: frontend
        run: ./scripts/ci-build.sh

      - name: Build Go Binaries (7 arch)
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: go
        run: ./scripts/ci-build.sh

      - name: Download OpenWrt SDK
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: sdk
        run: ./scripts/ci-build.sh

      - name: Compile Package
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: package
        run: ./scripts/ci-build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-clashv-${{ matrix.target.name }}
          path: tmp/out/*

  Release:
    runs-on: ubuntu-latest
    needs: [Version, Compile]
    if: ${{ always() && contains(needs.Compile.result, 'success') }}
    steps:
      # gh release create 需要从 git remote 推断仓库，必须先 checkout；
      # fetch-depth: 0 拉全量历史与 tag，才能生成上一个 tag 以来的提交列表
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.Version.outputs.version }}
        run: |
          ls -lh ./release
          # 「更新内容」= 上一个 tag（不含）到本 tag 的提交，剔除版本号提交本身；
          # 手动触发时可能还没有任何 tag/提交区间，留空兜底。
          # 提交说明习惯用「；」分句，按它拆成子列表逐条换行，避免渲染成一整坨
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          CHANGES=$(git log $RANGE --format='%h %s' --no-decorate 2>/dev/null \
            | grep -v 'chore: 版本号升至' \
            | awk '{
                hash = $1; sub(/^[^ ]+ +/, ""); msg = $0
                n = split(msg, part, /；/)
                printf "- **%s** %s\n", hash, part[1]
                for (i = 2; i <= n; i++) {
                  gsub(/^ +| +$/, "", part[i])
                  if (part[i] != "") printf "  - %s\n", part[i]
                }
              }')
          {
            echo "## 📝 更新内容"
            echo
            if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "- 本次发版无功能提交"; fi
          } > notes.md
          gh release create "$TAG" --title "clashv v${{ needs.Version.outputs.version }}" \
            --notes-file notes.md --latest || true
          gh release upload "$TAG" ./release/* --clobber
