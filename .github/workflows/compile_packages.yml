name: Build clashv (ipk & apk)

# 用法：
#   1. push 到 master 分支且改动相关目录时自动构建
#   2. Actions 页面手动 Run workflow 随时触发
# 产物：Actions Artifacts + GitHub Release（tag = v<openwrt/Makefile 里的 PKG_VERSION>）
#
# 平台说明：每个 target（ipk/apk）产出 8 个包 ——
#   luci-app-clashv(.ipk/.apk)          通用版：内置 7 种架构 Go 二进制，装哪个设备都行，
#                                       安装后由 /usr/bin/clashv 启动器按设备 DISTRIB_ARCH
#                                       自动选择，postinst 删除其余架构节省空间
#   luci-app-clashv-<arch>(.ipk/.apk)   架构精简版 ×7：只含对应架构二进制，包体约为通用版 1/7
# 全部包 PKGARCH:=all（安装器不校验设备架构，靠包名区分），互相 CONFLICTS。
# mihomo 内核由插件在界面上按架构一键下载。

on:
  # push: disabled during identity rewrite
    branches:
      - master
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'openwrt/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/compile_packages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read PKG_VERSION
        id: v
        run: |
          version=$(grep 'PKG_VERSION:=' ./openwrt/Makefile | awk -F '=' '{print $2}')
          if [ -z "$version" ]; then
            echo "::error::无法从 openwrt/Makefile 读取 PKG_VERSION"
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

  Compile:
    runs-on: ubuntu-latest
    needs: Version
    strategy:
      fail-fast: false
      matrix:
        target:
          # ipk：22.03 SDK（opkg 系统 22.03/23.05 全部可用）
          - name: ipk
          # apk：snapshot SDK（apk 系统即 OpenWrt 24.10+/snapshot）
          - name: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install curl git tar zstd rsync python3 python3-pyelftools python3-setuptools build-essential

      # 构建流程抽在 scripts/ci-build.sh，与本地 scripts/build-local-docker.sh 共用同一条
      # 流水线，按阶段拆步保证日志可读、耗时可查
      - name: Build Frontend (Vite)
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: frontend
        run: ./scripts/ci-build.sh

      - name: Build Go Binaries (7 arch)
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: go
        run: ./scripts/ci-build.sh

      - name: Download OpenWrt SDK
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: sdk
        run: ./scripts/ci-build.sh

      - name: Compile Package
        env:
          TARGET: ${{ matrix.target.name }}
          STAGE: package
        run: ./scripts/ci-build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-clashv-${{ matrix.target.name }}
          path: tmp/out/*

  Release:
    runs-on: ubuntu-latest
    needs: [Version, Compile]
    if: ${{ always() && contains(needs.Compile.result, 'success') }}
    steps:
      # gh release create 需要从 git remote 推断仓库，必须先 checkout
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.Version.outputs.version }}
        run: |
          ls -lh ./release
          gh release create "$TAG" --title "clashv v${{ needs.Version.outputs.version }}" \
            --notes "每个系统产出 8 个 OpenWrt 包：**luci-app-clashv**（无架构后缀，通用版，内置 7 种架构二进制，不确定设备架构时选它）与 **luci-app-clashv-<架构>** 精简版（arm64/armv7/mips/mipsle/amd64/riscv64/loong64，只含单一架构，包体约为通用版 1/7）。架构可在 SSH 里看 \`/etc/openwrt_release\` 的 DISTRIB_ARCH，或先装通用版由启动器自动识别。ipk 适用于 opkg 系统（OpenWrt 22.03/23.05）；apk 适用于 apk 系统（OpenWrt 24.10+/snapshot）。同一设备只能装一个，互相冲突。mihomo 内核请在插件「设置 → 内核」中一键下载。" \
            --latest || true
          gh release upload "$TAG" ./release/* --clobber
